[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inflowenger-plugin-sdk"
version = "0.1.2"
description = "Python SDK for building Inflowenger Plugin nodes (inflowv1 protocol) — the Python port of go-plugin-sdk."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mehdi Shokohifar", email = "mehdi.shokohifar@gmail.com" }]
keywords = ["inflowenger", "inflow", "plugin", "workflow", "nats", "sdk", "inflowv1"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "nats-py>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Inflowenger/py-plugin-sdk"
Repository = "https://github.com/Inflowenger/py-plugin-sdk"
Issues = "https://github.com/Inflowenger/py-plugin-sdk/issues"

[tool.setuptools.packages.find]
include = ["inflow_plugin_sdk*"]

[tool.setuptools.package-data]
inflow_plugin_sdk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
