# Publishes the package to PyPI when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The version that actually ships is the one in pyproject.toml; the tag must
# match it. Bump and commit pyproject.toml first, then tag.
#
# Auth: PyPI API token, stored as a GitHub Actions secret named PYPI_API_TOKEN.
#
#   1. On PyPI: Account settings → API tokens → "Add API token". With no
#      projects yet you can only make an ACCOUNT-scoped token — that's fine for
#      the first release. Copy the whole value (it starts with `pypi-`).
#   2. On GitHub: repo → Settings → Secrets and variables → Actions → New
#      repository secret. Name it exactly PYPI_API_TOKEN, paste the token.
#   3. Push a tag (below). After the first upload succeeds, create a
#      PROJECT-scoped token, replace the secret, and delete the account token.
#
# Prefer no stored secret? Switch to Trusted Publishing: add back
# `permissions: id-token: write`, drop the `with: password:` on the publish
# step, and register a pending publisher on PyPI (owner Inflowenger, repo
# py-plugin-sdk, workflow publish.yml, environment blank).
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade build

      # Fails loudly if the tag and pyproject version disagree, rather than
      # publishing a version nobody asked for.
      - name: Check tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag says v$tag_version but pyproject.toml says $version"
            exit 1
          fi

      - run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
