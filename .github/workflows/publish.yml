# Publishes the package to PyPI when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The version that actually ships is the one in pyproject.toml; the tag must
# match it. Bump and commit pyproject.toml first, then tag.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token secret needed. Configure a
# "pending publisher" on PyPI once (project name, owner/repo, workflow file
# `publish.yml`, environment `pypi`); after that this runs with no stored token.
# To use an API token instead, drop `permissions.id-token` and pass
# `password: ${{ secrets.PYPI_API_TOKEN }}` to the publish step.
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade build

      # Fails loudly if the tag and pyproject version disagree, rather than
      # publishing a version nobody asked for.
      - name: Check tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag says v$tag_version but pyproject.toml says $version"
            exit 1
          fi

      - run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
